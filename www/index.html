<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halfstop Tether</title>
<style>
  :root {
    color-scheme: dark;
    --paper: #15120f; --surface: #1d1917; --raised: #241f1c;
    --line: #362f2a; --line-strong: #4a423b; --line-bright: #6b6055;
    --ink: #f2ece3; --ink-2: #b8ada0; --ink-3: #8a8078;
    --clay: #e2734a; --pine: #6fae87; --warn: #d7a55c; --sky: #6aaed6;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    padding: 40px 20px 80px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin: 30px 0 10px; }
  .sub { color: var(--ink-3); font-size: 13.5px; margin: 0 0 26px; }
  .sub a { color: var(--ink-3); }
  button {
    font: inherit; font-weight: 650; min-height: 52px; padding: 0 18px; border-radius: 9px;
    background: var(--clay); color: #1c1815; border: 0; cursor: pointer; width: 100%;
  }
  button.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line-bright); font-weight: 400; }
  button:disabled { opacity: .35; cursor: default; }
  #status { margin: 16px 0 0; font-size: 13.5px; color: var(--ink-2); min-height: 20px; white-space: pre-wrap; }
  #status.bad { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.6; }
  #status.bad { color: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .camera-name { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .camera-now { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 6px; }
  .camera-lens { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
  .camera-lens.assumed { color: var(--warn); }
  #cameraNotes { margin: 12px 0 0; padding-left: 18px; font-size: 12.5px; line-height: 1.5; color: var(--warn); }

  #choices { display: flex; flex-direction: column; gap: 7px; }
  .choice {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink);
    min-height: 58px; padding: 10px 14px; text-align: left; font-weight: 400;
  }
  .choice-title { font-size: 14.5px; font-weight: 600; }
  .choice-says { font-size: 11.5px; color: var(--ink-3); }

  .row { display: flex; gap: 14px; align-items: baseline; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .row-label { width: 78px; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
  .row-value { font-family: var(--serif); font-size: 25px; line-height: 1; font-variant-numeric: tabular-nums; }
  .row-why { font-size: 11.5px; line-height: 1.4; color: var(--ink-3); margin-top: 4px; }

  .check { display: flex; flex-direction: column; gap: 3px; padding: 14px; border-radius: 9px; margin-bottom: 9px; }
  .check.yours { background: #33261c; border: 1px solid #6b4630; }
  .check.mine { background: #1a2822; border: 1px solid #2e4a3a; }
  .check.warn { background: var(--raised); border: 1px solid var(--line-strong); }
  .check-says { font-size: 13.5px; font-weight: 600; }
  .check-fix { font-size: 12px; line-height: 1.45; color: var(--ink-2); }
  #planReady { font-size: 13px; color: var(--pine); margin: 16px 0 0; }
  #planReady.blocked { color: var(--warn); }
  .stack { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
</style>

<main>
  <h1>Halfstop Tether</h1>
  <p class="sub">Say what you are shooting. It works the settings out from the lens that is
    mounted and the light that is there. <a href="./harness.html">Developer harness</a></p>

  <section id="connectScreen">
    <button id="connect">Connect a camera</button>
    <p class="sub" style="margin-top:14px">Chrome or Edge over USB — Safari has no WebUSB. Nothing leaves this page.</p>
  </section>

  <section id="cameraScreen" hidden>
    <div class="card">
      <div class="camera-name" id="cameraName"></div>
      <div class="camera-now" id="cameraNow"></div>
      <div class="camera-lens" id="cameraLens"></div>
      <ul id="cameraNotes" hidden></ul>
    </div>
    <h2>What are you shooting?</h2>
    <div id="choices"></div>
    <div class="stack"><button id="disconnect" class="ghost">Disconnect</button></div>
  </section>

  <section id="planScreen" hidden>
    <h2 id="planWhere"></h2>
    <h1 id="planTitle" style="font-size:26px"></h1>
    <div id="planRows" style="margin-top:14px"></div>
    <h2 id="planFiltersHead" hidden>Filters</h2>
    <div id="planFilters"></div>
    <h2 id="planChecksHead" hidden>Before you start</h2>
    <div id="planChecks"></div>
    <p id="planReady"></p>
    <div class="stack"><button id="back" class="ghost">Something else</button></div>
  </section>

  <p id="status"></p>
</main>

<script type="module">
import { App, renderCamera, renderChoices, renderPlan, show, el } from './src/ui/app.mjs';
import { explainUsbError, usbDiagnostics } from './src/ptp/webusb.mjs';

const app = new App();

const screen = (name) => {
  for (const id of ['connectScreen', 'cameraScreen', 'planScreen']) show(id, id === name);
};

el('connect').onclick = async () => {
  el('connect').disabled = true;
  try {
    const info = await app.connect();
    renderCamera(app, info);
    renderChoices(pick);
    screen('cameraScreen');
    app.status(`Connected. ${app.camera.writableByMode[app.camera.mode].length} of three exposure settings are mine to set in ${app.camera.mode}.`);
  } catch (error) {
    const seen = usbDiagnostics(app.transport?.device);
    app.status(explainUsbError(error) + (seen ? `\n\nThe device, as the browser sees it:\n${JSON.stringify(seen, null, 2)}` : ''), true);
  }
  el('connect').disabled = false;
};

function pick(intentId) {
  try {
    const plan = app.plan(intentId);
    renderPlan(plan, app.camera);
    screen('planScreen');
    app.status('');
  } catch (error) {
    app.status(error.message, true);
  }
}

el('back').onclick = () => screen('cameraScreen');
el('disconnect').onclick = async () => {
  await app.disconnect();
  screen('connectScreen');
  app.status('Disconnected.');
};

app.status(navigator.usb ? '' : 'This browser has no WebUSB. Chrome or Edge on desktop or Android.');
</script>
