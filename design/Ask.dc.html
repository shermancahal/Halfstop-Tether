<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #e2734a; } a:hover { color: #f08a63; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15120f; color: #f2ece3; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; padding: 60px 20px 34px;">

  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 40px;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #6fae87;"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8078;">Z5 · Wi-Fi</span>
  </div>

  <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; margin-bottom: 22px; text-wrap: pretty;">What are you shooting?</div>

  <div style="padding: 16px; min-height: 96px; background: #1d1917; border: 1px solid #4a423b; border-radius: 9px; margin-bottom: 10px;">
    <div style="font-size: 16px; line-height: 1.5; color: #f2ece3;">The Milky Way over the lake<span style="display: inline-block; width: 1.5px; height: 17px; background: #e2734a; vertical-align: -3px; margin-left: 1px;"></span></div>
  </div>
  <div style="font-size: 12px; color: #8a8078; margin-bottom: 34px;">Plain words. It works the rest out.</div>

  <div style="font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #8a8078; margin-bottom: 12px;">It already knows</div>
  <div style="display: flex; flex-direction: column; gap: 11px; margin-bottom: 34px;">
    <div style="display: flex; gap: 11px; align-items: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6fae87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      <span style="font-size: 13.5px; color: #b8ada0;">NIKKOR Z 20mm f/1.8 S, wide open at f/1.8</span>
    </div>
    <div style="display: flex; gap: 11px; align-items: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6fae87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      <span style="font-size: 13.5px; color: #b8ada0;">Dolly Sods, WV · Bortle 2 sky</span>
    </div>
    <div style="display: flex; gap: 11px; align-items: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6fae87" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      <span style="font-size: 13.5px; color: #b8ada0;">Tonight, 20:14 · moon 58%, up</span>
    </div>
  </div>

  <div style="font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #8a8078; margin-bottom: 12px;">Asked before</div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
    <div style="display: flex; align-items: center; padding: 0 14px; height: 44px; background: #1d1917; border: 1px solid #362f2a; border-radius: 22px; font-size: 13.5px; color: #b8ada0;">Waterfall, silky</div>
    <div style="display: flex; align-items: center; padding: 0 14px; height: 44px; background: #1d1917; border: 1px solid #362f2a; border-radius: 22px; font-size: 13.5px; color: #b8ada0;">Sunset timelapse</div>
    <div style="display: flex; align-items: center; padding: 0 14px; height: 44px; background: #1d1917; border: 1px solid #362f2a; border-radius: 22px; font-size: 13.5px; color: #b8ada0;">Barred owl at dusk</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: center; height: 52px; background: #e2734a; color: #1c1815; border-radius: 9px; font-size: 15px; font-weight: 650;">Work it out</div>
</div>
</x-dc>

</html>
