<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #e2734a; } a:hover { color: #f08a63; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15120f; color: #f2ece3; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; padding: 60px 20px 34px;">

  <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 28px;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8a8078;">Halfstop</div>
    <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: -.01em;">Tether</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 20px; background: #1d1917; border: 1px solid #362f2a; border-radius: 14px; margin-bottom: 16px;">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#6fae87" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>
      <circle cx="12" cy="12.5" r="3.5"/>
    </svg>
    <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 24px; font-weight: 600;">Nikon Z5</div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #6fae87;"></span>
      <span style="font-size: 13px; color: #b8ada0;">Connected over Wi-Fi</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px;">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 44px; background: #1d1917; border: 1px solid #362f2a; border-radius: 9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a8078" stroke-width="1.5" stroke-linecap="round"><path d="M9 4h6v5H9z"/><path d="M12 9v11"/><path d="M8 20h8"/></svg>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">USB-C</div>
      <div style="font-size: 13px; color: #8a8078;">No cable</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 44px; background: #241f1c; border: 1px solid #e2734a; border-radius: 9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e2734a" stroke-width="1.5" stroke-linecap="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #e2734a;">Wi-Fi</div>
      <div style="font-size: 13px; color: #f2ece3;">Fair · 2 bars</div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 13px 14px; background: #33261c; border: 1px solid #6b4630; border-radius: 9px; margin-bottom: 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d7a55c" stroke-width="1.6" stroke-linecap="round" style="flex: none; margin-top: 1px;"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="#d7a55c"/><path d="M12 3.5 2.5 20h19z"/></svg>
    <div style="font-size: 12.5px; line-height: 1.45; color: #e8d9c4;">Wi-Fi on this body drops. Use the cable for anything you can't shoot twice.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid #362f2a;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid #362f2a;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">Lens</span>
      <span style="font-size: 13.5px;">NIKKOR Z 20mm f/1.8 S</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid #362f2a;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">Battery</span>
      <span style="font-size: 13.5px; font-variant-numeric: tabular-nums;">87%</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid #362f2a;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">Card</span>
      <span style="font-size: 13.5px; font-variant-numeric: tabular-nums;">Slot 1 · 412 free</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: center; height: 52px; background: #e2734a; color: #1c1815; border-radius: 9px; font-size: 15px; font-weight: 650;">Start</div>
</div>
</x-dc>
</body>
</html>
