<!doctype html>

<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a0402; color: #ff6a42; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; padding: 60px 20px 34px;">

      <circle cx="310" cy="96" r="1.5"/><circle cx="20" cy="72" r="1"/><circle cx="258" cy="14" r="1.1"/>
    </g>

    <rect x="140" y="78" width="70" height="52" fill="none" stroke="#ff3d14" stroke-width="1.4" rx="2"/>

  <div style="display: flex; gap: 10px; padding: 11px 13px; background: #1a0805; border: 1px solid #521a0c; border-radius: 9px; margin-bottom: 16px; align-items: center;">

  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 9px;">
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #1a0805; border: 1px solid #521a0c; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a83c1e;">Shutter</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;">12s</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #1a0805; border: 1px solid #521a0c; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a83c1e;">Aperture</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;">f/1.8</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #1a0805; border: 1px solid #521a0c; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a83c1e;">ISO</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;">3200</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px;">
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #120503; border: 1px dashed #3d1409; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a3319;">Mode</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; color: #a83c1e;">M</div>
      <div style="font-size: 10px; line-height: 1.3; color: #8a3319;">the dial, not me</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #120503; border: 1px dashed #3d1409; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a3319;">Exp comp</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; color: #a83c1e;">—</div>
      <div style="font-size: 10px; line-height: 1.3; color: #8a3319;">does nothing in M</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; min-height: 44px; background: #1a0805; border: 1px solid #521a0c; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #a83c1e;">White bal</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;">3900K</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="font-size: 11.5px; line-height: 1.45; color: #8a3319; margin-bottom: 12px; text-wrap: pretty;">Red only, and dim. Twenty minutes of dark adaptation is not worth a white screen.</div>

  <div style="display: flex; align-items: center; justify-content: center; height: 52px; background: #7a1f0a; color: #ffb499; border-radius: 9px; font-size: 15px; font-weight: 650;">Run the plan · 16 frames</div>
</div>
