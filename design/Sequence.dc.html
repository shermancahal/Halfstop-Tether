<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #e2734a; } a:hover { color: #f08a63; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15120f; color: #f2ece3; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; padding: 60px 20px 34px;">

  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 30px;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #6fae87; flex: none;"></span>
    <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8078; flex-grow: 1;">Running · Milky Way stack</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; margin-bottom: 26px;">
    <svg width="188" height="188" viewBox="0 0 188 188">
      <circle cx="94" cy="94" r="82" fill="none" stroke="#241f1c" stroke-width="9"/>
      <circle cx="94" cy="94" r="82" fill="none" stroke="#e2734a" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="515.2" stroke-dashoffset="225.4" transform="rotate(-90 94 94)"/>
      <text x="94" y="88" text-anchor="middle" font-family="'Iowan Old Style', Palatino, Georgia, serif" font-size="42" fill="#f2ece3">9</text>
      <text x="94" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#8a8078">of 16 frames</text>
    </svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 22px;">
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; background: #1d1917; border: 1px solid #362f2a; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8078;">Next</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;">8s</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; background: #1d1917; border: 1px solid #362f2a; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8078;">Elapsed</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;">2m28</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 5px; padding: 12px 10px; background: #1d1917; border: 1px solid #362f2a; border-radius: 9px;">
      <div style="font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8078;">Left</div>
      <div style="font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums;">1m24</div>
    </div>
  </div>

  <div style="display: flex; gap: 11px; padding: 14px; background: #1a2228; border: 1px solid #2e4351; border-radius: 9px; margin-bottom: 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6aaed6" stroke-width="1.6" stroke-linecap="round" style="flex: none; margin-top: 1px;"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div style="font-size: 13.5px; font-weight: 600; color: #f2ece3;">Wi-Fi went away for 40 seconds</div>
      <div style="font-size: 12px; line-height: 1.45; color: #9bb4c4;">22:11 to 22:12. Two frames re-shot on reconnect. The run never stopped and nothing was lost.</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; border-top: 1px solid #362f2a;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid #362f2a;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">Card</span>
      <span style="font-size: 13px; color: #b8ada0;"><span style="color: #6fae87;">412 free</span> · 16 needed</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 13px 2px; border-bottom: 1px solid #362f2a;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a8078;">Battery</span>
      <span style="font-size: 13px; color: #b8ada0;"><span style="color: #6fae87;">86%</span> · no concern</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: center; height: 52px; background: transparent; border: 1px solid #4a423b; color: #b8ada0; border-radius: 9px; font-size: 15px;">Stop after this frame</div>
</div>
</x-dc>
</body>
</html>
